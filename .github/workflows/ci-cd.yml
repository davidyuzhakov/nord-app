name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    name: Check ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        if: matrix.package == 'backend'
        env:
          DATABASE_URL: postgresql://noop:noop@localhost:5432/noop
        run: npx prisma generate

      - name: Check backend
        if: matrix.package == 'backend'
        run: |
          npx eslint "{src,apps,libs,test}/**/*.ts"
          npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Check frontend
        if: matrix.package == 'frontend'
        run: |
          npm run lint
          npm run format:check

  deploy:
    name: Deploy release
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_PORT: ${{ '22' }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
      COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
      RELEASE_TAG: ${{ github.ref_name }}
    concurrency:
      group: nord-app-production
      cancel-in-progress: false
    steps:
      - name: Validate deployment configuration
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          for variable in VPS_SSH_KEY VPS_HOST VPS_PORT VPS_USER VPS_APP_DIR COMPOSE_PROJECT_NAME; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing configuration: $variable"
              exit 1
            fi
          done

      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ env.VPS_HOST }}
          port: ${{ env.VPS_PORT }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 15s
          command_timeout: 30m
          version: '1.8.2'
          envs: VPS_APP_DIR,COMPOSE_PROJECT_NAME,RELEASE_TAG
          script: |
            set -eu
            cd -- "$VPS_APP_DIR"
            export COMPOSE_FILE=docker-compose.yml

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo 'На VPS есть изменения в отслеживаемых файлах. Сначала разберись с ними.' >&2
              exit 1
            fi

            export GIT_TERMINAL_PROMPT=0
            export GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=yes'
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
            git checkout --no-overwrite-ignore --detach 'FETCH_HEAD^{commit}'

            docker compose build backend frontend
            docker compose up -d --no-deps --no-build backend frontend
            docker compose run --rm --no-deps -T nginx nginx -t
            docker compose up -d --no-deps --no-build --force-recreate nginx

      - name: Verify website and API
        timeout-minutes: 9
        run: |
          for url in https://nord-app.ru/ https://api.nord-app.ru/song; do
            echo "Проверяем $url"
            status=$(curl --fail --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --connect-timeout 3 --max-time 5 \
              --retry 23 --retry-delay 5 --retry-max-time 240 --retry-all-errors "$url")

            if [[ "$status" != 200 ]]; then
              echo "::error::Деплой не прошёл проверку: $url отвечает HTTP $status."
              exit 1
            fi
          done

          printf 'Deployed `%s`.\n' "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
